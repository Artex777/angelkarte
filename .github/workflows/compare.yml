name: Vergleich Original vs. App
on:
  push:
    branches: [qa]
    paths: [qa/compare.js, qa/arcgis.html, .github/workflows/compare.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: ONLY_TEST=1 node qa/compare.js || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add qa/cmp
          git commit -m "Vergleichsbilder" || echo "nichts"
          git pull --rebase origin qa
          git push origin HEAD:qa
