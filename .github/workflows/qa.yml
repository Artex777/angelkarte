name: QA-Screenshots
on:
  push:
    branches: [qa]
    paths: [qa/test.js, .github/workflows/qa.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node qa/test.js || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add qa/out
          git commit -m "QA-Ergebnisse" || echo "nichts"
          git push origin HEAD:qa
