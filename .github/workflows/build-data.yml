name: Kartendaten bauen
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # jeden Montag früh
  push:
    paths: [tools/build_data.py, .github/workflows/build-data.yml]
permissions:
  contents: write
concurrency: build-data
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_data.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "Kartendaten aktualisiert" || echo "keine Änderungen"
          git pull --rebase origin main
          git push
