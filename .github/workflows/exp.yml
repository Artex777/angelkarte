name: Experience-Konfiguration laden
on:
  push:
    branches: [qa]
    paths: [qa/fetch_exp.py, .github/workflows/exp.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 qa/fetch_exp.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add qa/exp
          git commit -m "Experience-Konfiguration" || echo "nichts"
          git pull --rebase origin qa
          git push origin HEAD:qa
