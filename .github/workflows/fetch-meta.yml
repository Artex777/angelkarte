name: Kartendaten-Metadaten laden
on:
  workflow_dispatch:
  push:
    paths: [tools/fetch_meta.py, .github/workflows/fetch-meta.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_meta.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add meta
          git commit -m "Metadaten aktualisiert" || echo "keine Änderungen"
          git push
