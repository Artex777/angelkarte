<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>html,body,#v{margin:0;height:100%}</style><script src="https://js.arcgis.com/4.30/"></script></head>
<body><div id="v"></div><script>
const q = new URLSearchParams(location.search);
require(["esri/WebMap", "esri/views/MapView", "esri/core/reactiveUtils"], (WebMap, MapView, ru) => {
  const view = new MapView({ container: "v", map: new WebMap({ portalItem: { id: q.get("id") } }),
    center: [+q.get("lon"), +q.get("lat")], zoom: +q.get("z"), ui: { components: [] } });
  view.when(() => ru.whenOnce(() => !view.updating).then(() => setTimeout(() => window.READY = true, 3000)));
});
</script></body></html>
