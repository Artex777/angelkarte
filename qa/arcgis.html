<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>html,body,#v{margin:0;height:100%}</style><script src="https://js.arcgis.com/4.30/"></script></head>
<body><div id="v"></div><script>
const q = new URLSearchParams(location.search);
require(["esri/WebMap", "esri/views/MapView", "esri/core/reactiveUtils", "esri/symbols/support/symbolUtils"], (WebMap, MapView, ru, symbolUtils) => {
  const map = new WebMap({ portalItem: { id: q.get("id") } });
  const view = window.view = new MapView({ container: "v", map, ui: { components: [] } });
  view.when(async () => {
    await view.goTo({ center: [+q.get("lon"), +q.get("lat")], scale: +q.get("scale") }, { animate: false });
    await map.loadAll();
    const only = q.get("only");
    if (only) map.allLayers.forEach(l => { if (l.type !== "group" && l.url) l.visible = l.title === only; });
    if (q.get("direct")) { const FL = await new Promise(r => require(["esri/layers/FeatureLayer"], r)); map.removeAll(); map.add(new FL({ url: q.get("direct") })); }
    await ru.whenOnce(() => !view.updating);
    await new Promise(r => setTimeout(r, 8000));
    await ru.whenOnce(() => !view.updating);
    const info = [];
    for (const l of map.allLayers.toArray()) {
      if (l.type === "group" || !l.url) continue;
      const lv = view.allLayerViews.find(v => v.layer === l);
      let cnt = null, drawn = null, sample = null;
      try {
        if (lv && !lv.suspended && lv.queryFeatures) {
          const res = await lv.queryFeatures({ geometry: view.extent, returnGeometry: false, outFields: ["*"] });
          cnt = res.features.length; drawn = 0;
          for (const g of res.features) {
            g.layer = l;
            const sym = await symbolUtils.getDisplayedSymbol(g);
            if (sym) drawn++; else if (!sample) sample = g.attributes;
          }
        }
      } catch (e) { cnt = "err " + e.message; }
      info.push({ count: cnt, drawn, undrawnSample: sample, rendererJSON: l.renderer ? JSON.stringify(l.renderer.toJSON()).slice(0, 1500) : null, title: l.title, url: l.url + "/" + l.layerId, visible: l.visible, effVisible: l.visible && (!l.parent || l.parent.visible !== false),
        minScale: l.minScale, maxScale: l.maxScale, opacity: l.opacity, suspended: lv ? lv.suspended : null, renderer: l.renderer && l.renderer.type,
        def: l.definitionExpression || null });
    }
    window.INFO = { scale: view.scale, zoom: view.zoom, extent: [view.extent.xmin, view.extent.ymin, view.extent.xmax, view.extent.ymax], layers: info };
    window.READY = true;
  });
});
</script></body></html>
